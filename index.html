<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd23f">
<title>Jornada</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jornada">
<meta name="description" content="Asistencia, check-in con ubicación y pagos para trabajadoras de casa particular y del campo.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday app: a full office for the employer, a big-button tool for workers who rarely use phones
   IDEA the paper attendance "libreta" turned into a shipped mobile app
   PICTURE the working app: a giant arrival button for the worker, live check-in cards and the month for the employer
   COLOUR white ground, sun yellow fields, black ink, cobalt accent; night #121316
   TYPE Plus Jakarta Sans throughout; worker view one size larger
   LAYOUT one phone-width column with bottom tab bar; framed and centered on wide screens */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121316);--bg2:light-dark(#ecebe4,#08090b);--ink:light-dark(#15161a,#f3f2ee);--mute:light-dark(#5d6069,#a4a7ae);--line:light-dark(#e3e1d8,#2a2c31);--card:light-dark(#f6f5f0,#1b1d22);--sun:#ffd23f;--sunink:#15161a;--blue:light-dark(#2346ff,#8396ff);--onblue:light-dark(#ffffff,#0b0c10);--p:#1f9d55;--a:#e5484d;--l:#f59e0b;--v:#3b82f6;--f:#8b5cf6;--x:#9a9ea8}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg2);color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#app{position:relative;max-width:440px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:520px){#app{height:calc(100% - 40px);margin-top:20px;border-radius:28px;box-shadow:0 0 0 1px var(--line)}}
main{flex:1;overflow-y:auto;padding:0 16px 28px}
.top{background:var(--sun);color:var(--sunink);padding:calc(18px + env(safe-area-inset-top,0px)) 20px 22px;margin:0 -16px 16px;border-radius:0 0 26px 26px}
.top small{display:block;font-size:14px;font-weight:600;opacity:.75}
.top h1{margin:2px 0 0;font-size:32px;line-height:1.05;letter-spacing:-.02em;font-weight:800}
.top p{margin:6px 0 0;font-size:15px;opacity:.8}
.toprow{display:flex;align-items:center;gap:12px}
.stgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5em,1fr));gap:8px}
.stgrid div{background:var(--card);border-radius:14px;padding:10px 12px}
.stgrid b{display:block;font-size:22px;letter-spacing:-.02em;white-space:nowrap}
.stgrid span{font-size:13px;color:var(--mute)}
.stgrid small{display:block;font-size:12px;color:var(--mute)}
.barrow{display:grid;grid-template-columns:6.5em minmax(0,1fr) 3.2em;gap:8px;align-items:center;padding:6px 0;font-size:14px}
.barrow .tr{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.barrow .tr i{display:block;height:100%;border-radius:7px}
.barrow b{text-align:right;font-variant-numeric:tabular-nums}
.wstat .stgrid div{background:var(--bg)}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:0;border-radius:99px;background:rgb(0 0 0/.1);color:var(--sunink);font-weight:700;font-size:15px;cursor:pointer;flex:none}
.back{width:44px;height:44px;border-radius:14px;border:0;background:rgb(0 0 0/.08);color:var(--sunink);display:grid;place-items:center;cursor:pointer;flex:none}
h2{font-size:18px;margin:22px 0 10px;letter-spacing:-.01em}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1}
.name{font-weight:700;font-size:16px;line-height:1.25}
.sub{color:var(--mute);font-size:14px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--sun);color:var(--sunink);flex:none}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);margin-left:4px;vertical-align:1px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.btn{min-height:48px;border-radius:14px;border:0;padding:0 16px;font-weight:700;cursor:pointer;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:focus-visible,.chip:focus-visible,.nav button:focus-visible,.day:focus-visible,.go:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn.pri{background:var(--blue);color:var(--onblue);box-shadow:none}
.btn.dark{background:var(--ink);color:var(--bg);box-shadow:none}
.btn.on-p{background:var(--p);color:#fff;box-shadow:none}
.btn.on-a{background:var(--a);color:#fff;box-shadow:none}
.btn.full{width:100%}
.btn.sm{min-height:40px;font-size:14px;padding:0 12px}
.btn:active{transform:scale(.98)}
.note{font-size:14px;color:var(--mute);margin-top:10px;display:flex;gap:6px;align-items:center}
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--card);margin-bottom:10px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:7px}
.x{width:36px;height:36px;border:0;border-radius:10px;background:none;color:var(--mute);cursor:pointer;flex:none;font-size:20px;line-height:1}
.big{font-size:clamp(34px,10vw,44px);font-weight:800;letter-spacing:-.03em;line-height:1.05;white-space:nowrap}
.lines div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.lines div:first-child{border-top:0}
.lines b{white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.lines .tot{font-weight:800;font-size:17px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{flex:none;min-height:40px;padding:0 16px;border-radius:999px;border:0;background:var(--card);font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{text-align:center;font-size:13px;color:var(--mute);font-weight:600}
.day{aspect-ratio:1;border:0;border-radius:12px;background:var(--bg);font-weight:700;font-size:15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:inset 0 0 0 1px var(--line);position:relative}
.day.off{background:transparent;box-shadow:none;color:var(--mute);font-weight:500}
.day.today{box-shadow:inset 0 0 0 2.5px var(--blue)}
.day i{width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 1.5px rgb(0 0 0/.25)}
.day.st{color:#fff;box-shadow:none}
.day.today.st{box-shadow:0 0 0 2.5px var(--blue)}
.day .ot{position:absolute;top:3px;right:5px;font-size:10px;font-weight:800}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mhead b{font-size:17px}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:var(--bg);cursor:pointer;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line);flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:14px;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%}
.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(5.5em,1fr));gap:8px;margin-top:12px}
.counts div{background:var(--bg);border-radius:12px;padding:8px 10px}
.counts b{display:block;font-size:20px}
.counts span{font-size:13px;color:var(--mute)}
.hist{padding:12px 0;border-top:1px solid var(--line)}
.hist:first-child{border-top:0}
.amt{font-weight:800;white-space:nowrap}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.nav{display:grid;border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{border:0;background:none;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:600;color:var(--mute);cursor:pointer;position:relative}
.nav button.on{color:var(--ink)}
.nav button.on svg{background:var(--sun);color:var(--sunink);border-radius:999px}
.nav svg{width:52px;height:30px;padding:4px 14px}
.nav .n{position:absolute;top:6px;left:calc(50% + 8px);min-width:20px;height:20px;border-radius:10px;background:var(--a);color:#fff;font-size:12px;display:grid;place-items:center;padding:0 5px}
.shade{position:absolute;inset:0;background:rgb(0 0 0/.45);display:none;align-items:flex-end;z-index:5}
.shade.open{display:flex}
.sheet{background:var(--bg);width:100%;border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto}
.sheet:before{content:"";display:block;width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 6px;font-size:22px;letter-spacing:-.02em}
.sheet h4{margin:20px 0 4px;font-size:16px}
.opts{display:grid;gap:8px;margin-top:14px}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:10px 12px;font-size:16px}
textarea{min-height:96px;resize:vertical}
input[type=file]{padding:10px;min-height:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.okm{color:var(--p);font-size:14px;font-weight:600;margin-top:6px}
.warnbox{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--l) 18%,var(--bg));box-shadow:inset 0 0 0 1.5px var(--l);margin-top:10px;font-size:15px}
.warnbox svg{flex:none;color:#b45309}
.err{color:var(--a);font-size:14px;font-weight:600;margin-top:6px}
.daysel{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.daysel button{min-height:44px;border-radius:12px;border:0;background:var(--card);font-weight:700;cursor:pointer}
.daysel button.on{background:var(--ink);color:var(--bg)}
.stsel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stsel button{min-height:48px;border-radius:12px;border:0;background:var(--card);font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 6px}
.stsel button i{width:10px;height:10px;border-radius:50%;flex:none}
.stsel button.on{box-shadow:inset 0 0 0 2.5px var(--ink)}
.step{display:flex;align-items:center;gap:10px}
.step b{min-width:4ch;text-align:center;font-size:20px}
.code{font-size:38px;font-weight:800;letter-spacing:.06em;text-align:center;padding:18px;border-radius:18px;background:var(--sun);color:var(--sunink);margin:14px 0}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:var(--ink);color:var(--bg);padding:14px 16px;border-radius:14px;font-weight:600;z-index:6;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.welcome{flex:1;display:flex;flex-direction:column;background:var(--sun);color:var(--sunink);padding:calc(28px + env(safe-area-inset-top,0px)) 24px 28px;overflow-y:auto}
.welcome h1{font-size:46px;line-height:1;letter-spacing:-.03em;margin:18px 0 8px}
.welcome p{font-size:17px;margin:0;max-width:30ch}
.book{flex:1;min-height:150px;display:grid;place-items:center}
.book svg{width:min(260px,70%)}
.wbtn{display:flex;align-items:center;gap:14px;width:100%;min-height:76px;border:0;border-radius:20px;padding:12px 18px;margin-top:10px;background:var(--sunink);color:#fff;text-align:left;cursor:pointer}
.wbtn.alt{background:#fff;color:var(--sunink)}
.wbtn b{display:block;font-size:19px}
.wbtn span{font-size:15px;opacity:.75}
.fine{font-size:13px;opacity:.7;margin-top:14px;text-align:center}
.empty{color:var(--mute);font-size:15px;padding:8px 0}
.live{background:#15161a;color:#f3f2ee;border-radius:24px;padding:16px;margin-bottom:12px;box-shadow:inset 0 0 0 2px var(--p)}
.live.warn{box-shadow:inset 0 0 0 2px var(--l)}
.live.bad{box-shadow:inset 0 0 0 2px var(--a)}
.live .av{background:#ffd23f}
.live .lk{font-size:13px;font-weight:700;color:#ffd23f}
.live.warn .lk{color:#ffb547}
.live.bad .lk{color:#ff8a8d}
.live .name{font-size:18px}
.live .time{font-size:28px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.live .note{color:#c9cbd1}
.live .maplink{color:#c9d2ff}
.live .btn:not(.pri):not(.on-p):not(.on-a){background:#23252b;color:#f3f2ee;box-shadow:none}
.inout{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.inout div{background:color-mix(in srgb,currentColor 8%,transparent);border-radius:12px;padding:8px 10px}
.inout span{display:block;font-size:12px;opacity:.75}
.inout b{font-size:17px;white-space:nowrap}
.map{display:block;width:100%;height:auto;aspect-ratio:320/170;border-radius:16px;margin-top:12px}
.pulse{transform-box:fill-box;transform-origin:center;animation:pl 1.8s ease-out infinite;opacity:.5}
@keyframes pl{from{transform:scale(1);opacity:.55}to{transform:scale(3.2);opacity:0}}
.ckmeta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:14px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px;color:#fff;white-space:nowrap}
.badge.in{background:var(--p)}
.badge.out{background:var(--a)}
.maplink{display:inline-block;margin-top:8px;font-size:14px;font-weight:600;color:var(--blue);min-height:32px;padding-top:6px}
.why{margin-top:10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,currentColor 9%,transparent);font-size:15px}
.ask{margin-top:12px;font-weight:700}
.logl{display:flex;gap:10px;font-size:14px;padding-top:8px}
.logl b{white-space:nowrap;font-variant-numeric:tabular-nums}
.radio{display:flex;gap:12px;align-items:flex-start;margin:0;padding:12px;border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:400;cursor:pointer}
.radio input{width:22px;min-height:22px;height:22px;margin:2px 0 0;flex:none;accent-color:var(--blue)}
.switch{display:flex;gap:14px;align-items:center;width:100%;margin-top:12px;padding:12px 0 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;font-size:14px;color:var(--mute);cursor:pointer}
.switch b{color:var(--ink);font-size:15px}
.switch i{flex:none;width:52px;height:30px;border-radius:99px;background:var(--line);position:relative}
.switch i:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.switch[aria-checked=true] i{background:var(--p)}
.switch[aria-checked=true] i:after{left:25px}
.ckday{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.spin{width:48px;height:48px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--blue);margin:22px auto;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.subtabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:-4px 0 14px}
.subtabs button{min-height:44px;padding:0 8px;border-radius:12px;border:0;background:var(--card);font-weight:700;font-size:14px;cursor:pointer}
.subtabs button.on{background:var(--ink);color:var(--bg)}
.subtabs.four{display:flex}.subtabs.four button{flex:1 1 auto;font-size:13px;padding:0 7px;white-space:nowrap}
.subtabs.two{grid-template-columns:repeat(2,minmax(0,1fr))}.subtabs.mini{margin-top:0}.subtabs.mini button{min-height:36px;font-size:13px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 ui-monospace,Menlo,monospace;background:var(--card);border-radius:14px;padding:14px;max-height:320px;overflow-y:auto;margin:10px 0 0}
.thread{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.bub{max-width:82%;padding:10px 14px;border-radius:18px;background:var(--card);font-size:16px}
.bub.me{align-self:flex-end;background:var(--blue);color:var(--onblue)}
.bub small{display:block;font-size:12px;opacity:.7;margin-top:2px}
.pinwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--sun);color:var(--sunink);padding:24px}
.pdots{display:flex;gap:14px;margin:20px 0}
.pdots i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--sunink)}
.pdots i.on{background:var(--sunink)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:50%;border:0;background:rgb(255 255 255/.55);font-size:26px;font-weight:700;cursor:pointer;color:var(--sunink)}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.thumb{max-width:100%;border-radius:14px;margin-top:10px}
/* worker mode: larger, simpler */
.wk main{font-size:18px}
.wk .top h1{font-size:36px}
.wk .sub{font-size:16px}
.wk .name{font-size:19px}
.wk .btn{min-height:58px;font-size:18px;border-radius:16px}
.wk .nav button{font-size:15px;min-height:70px}
.wk .day{font-size:17px}
.go{display:flex;flex-direction:column;align-items:center;justify-content:center;width:min(240px,70vw);aspect-ratio:1;border-radius:50%;border:0;margin:8px auto 4px;cursor:pointer;background:var(--sun);color:var(--sunink);box-shadow:0 10px 0 #d9ad12,0 0 0 10px color-mix(in srgb,var(--sun) 25%,transparent);font-weight:800;font-size:34px;letter-spacing:-.02em;line-height:1.05}
.go small{display:block;font-size:16px;font-weight:600;letter-spacing:0;margin-top:6px;opacity:.8}
.go.out{background:#15161a;color:#fff;box-shadow:0 10px 0 #000,0 0 0 10px rgb(21 22 26/.15)}
.go:active{transform:translateY(6px);box-shadow:0 4px 0 #d9ad12}
.state{text-align:center;padding:8px 0 4px}
.state .ic{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;color:#fff}
.state h3{margin:0;font-size:26px;letter-spacing:-.02em}
.state p{margin:6px 0 0;color:var(--mute);font-size:17px}
.qk{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qk button{min-height:76px;border:0;border-radius:18px;background:var(--card);font-weight:700;font-size:17px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px}
.money{background:var(--sun);color:var(--sunink);border-radius:24px;padding:20px;margin-bottom:12px}
.money .big{font-size:clamp(40px,12vw,52px)}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:0;border-radius:99px;background:rgb(0 0 0/.1);color:var(--sunink);font-weight:700;font-size:15px;cursor:pointer;flex:none;position:relative}
.pn{min-width:20px;height:20px;border-radius:10px;background:var(--a);color:#fff;font-size:12px;display:grid;place-items:center;padding:0 5px}
.offchip,.nban{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;margin-bottom:12px;font-size:16px}
.offchip{background:color-mix(in srgb,var(--l) 20%,var(--bg));box-shadow:inset 0 0 0 1.5px var(--l)}
.nban{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--blue)}
.offchip svg,.nban svg{flex:none}
.crewrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.crewsel{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);margin:0;font-weight:400;cursor:pointer;font-size:18px}
.crewsel input{width:28px;height:28px;min-height:28px;flex:none;accent-color:var(--blue)}

function readFile(file){return new Promise((res,rej)=>{if(!file)return res(null);
  if(file.type==='application/pdf'){if(file.size>1.5*1024*1024)return rej('El PDF pesa más de 1,5 MB.');const r=new FileReader();r.onload=()=>res({name:file.name,data:r.result});r.onerror=()=>rej('No se pudo leer el archivo.');r.readAsDataURL(file);return}
  if(!file.type.startsWith('image/'))return rej('Sube una foto o un PDF.');
  const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,1200/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res({name:file.name.replace(/\.\w+$/,'')+'.jpg',data:c.toDataURL('image/jpeg',.75)})};img.onerror=()=>rej('No se pudo abrir la imagen.');img.src=u})}

/* ---------- PDF y descargas ---------- */
function pdfBlob(title,text){
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J)throw 'No se pudo cargar el generador de PDF.';
  const doc=new J({unit:'mm',format:'letter'}),W_=doc.internal.pageSize.getWidth(),H_=doc.internal.pageSize.getHeight(),m=20;
  const clean=t=>String(t).replace(/[−–—]/g,'-').replace(/•/g,'-').replace(/[“”]/g,'"').replace(/[‘’]/g,"'");
  let y=m;doc.setFont('helvetica','bold');doc.setFontSize(13);
  for(const l of doc.splitTextToSize(clean(title),W_-2*m)){doc.text(l,m,y);y+=6.5}
  y+=3;doc.setFont('helvetica','normal');doc.setFontSize(10.5);
  for(const para of clean(text).split('\n')){
    const lines=para.trim()?doc.splitTextToSize(para,W_-2*m):[''];
    for(const l of lines){if(y>H_-m){doc.addPage();y=m}doc.text(l,m,y);y+=5.2}
  }
  const n=doc.getNumberOfPages();doc.setFontSize(8.5);doc.setTextColor(120);
  for(let i=1;i<=n;i++){doc.setPage(i);doc.text('Generado con Jornada · página '+i+' de '+n,m,H_-10)}
  return doc.output('blob');
}
async function saveFile(filename,data){
  let d=null;try{d=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){d=null}
  if(d){try{await d.save({filename,data});toast('Descargado: '+filename)}catch(err){if(err&&err.code==='declined')toast('Descarga cancelada');else if(err&&err.code==='rate_limited')toast('Espera un momento y vuelve a intentar');else toast('No se pudo descargar aquí')}return}
  try{const blob=data instanceof Blob?data:new Blob([data]),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Descargado: '+filename)}catch(e){toast('No se pudo descargar aquí')}
}

async function flushQueue(){const items=Object.entries(sync.queue);if(!items.length)return true;const groups={};
  for(const[k,it]of items)(groups[it.t+'|'+it.op]||(groups[it.t+'|'+it.op]=[])).push([k,it]);let offline=false;
  const send=async(t,op,g)=>{let r;try{r=op==='up'?await sb.from(t).upsert(g.map(x=>x[1].row),{onConflict:t==='employers'?'id':'employer_id,id'}):await sb.from(t).delete().eq('employer_id',EID()).in('id',g.map(x=>x[1].key))}catch(e){r={error:e}}return r.error?String(r.error.message||r.error):null};

    const err=await send(t,op,g);

    if(err&&g.length>1){for(const x of g){const e1=await send(t,op,[x]);if(e1&&netErr(e1)){offline=true;break}if(e1)console.warn('Jornada: no se pudo guardar',t,x[0],e1);delete sync.queue[x[0]]}continue}

async function pull(full){

  const res=await Promise.all(tabs.map(t=>{let q=sb.from(t).select('*').eq(t==='employers'?'id':'employer_id',EID());const since=!full&&sync.since[t];if(since)q=q.gt('updated_at',since);return q.limit(10000)}));
  for(let i=0;i<tabs.length;i++){const t=tabs[i],r=res[i];if(r.error){if(OPTT.has(t))continue;throw r.error}
    for(const row of r.data||[]){if(!sync.since[t]||row.updated_at>sync.since[t])sync.since[t]=row.updated_at;if(sync.queue[t+'|'+row.id])continue;applyRow(t,row);changed=true;(applied[t]||(applied[t]=[])).push(row.id)}}
  if(full||Date.now()-sync.lastKeys>120000){
    computeDiff();
    const kr=await Promise.all(tabs.slice(1).map(t=>sb.from(t).select('id').eq('employer_id',EID()).limit(20000)));
    for(let i=0;i<kr.length;i++){const t=tabs[i+1],r=kr[i];if(r.error){if(OPTT.has(t))continue;throw r.error}const set=new Set((r.data||[]).map(x=>x.id));

    sync.lastKeys=Date.now();

  if(changed){sortLists();const R=rowsFromS();for(const t in applied)if(R[t])for(const k of applied[t])if(R[t][k])(sync.synced[t]||(sync.synced[t]={}))[k]=hash(canon(R[t][k]))}
